[package]
name = "ai-news-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Pure, deterministic feed normalization shared by AI Signal runtimes"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
html-escape = "0.2"
quick-xml = "0.38"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
url = "2"

wasm-bindgen = { version = "0.2", optional = true }
